<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6ebf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#04050b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- content runs under the status bar; the top bar pads by env(safe-area-inset-top) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ledger">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Your family's money across Saudi Arabia and India">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Ledger</title>
  <!-- launch screen and first paint match the app background instead of flashing white -->
  <style>html { background: #e6ebf7; } @media (prefers-color-scheme: dark) { html { background: #04050b; } }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
