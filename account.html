<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Account · Expenses</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root { --bg: #f7f7f8; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #d4d4d8; --accent: #15803d; --accent-text: #fff; --error: #b91c1c; --ok: #15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1c1c1f; --text: #ececee; --muted: #9a9aa1; --line: #3a3a40; --accent: #4ade80; --accent-text: #052e16; --error: #f87171; --ok: #4ade80; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--accent-text); font-size: 24px; font-weight: 700; margin-bottom: 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  .field { position: relative; margin-bottom: 16px; }
  input { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  input[type=password], input.pw { padding-right: 64px; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .show { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 13px; padding: 6px 8px; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .msg { font-size: 14px; margin: 8px 0 0; color: var(--error); } .msg.ok { color: var(--ok); }
  .submit { width: 100%; margin-top: 8px; padding: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .links { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; font-size: 14px; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">﷼</div>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <form method="post" id="form">
    <input type="hidden" name="t" id="t">
    <div id="email-row">
      <label for="email">Email</label>
      <div class="field"><input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com"></div>
    </div>
    <div id="pw-row">
      <label for="password" id="pw-label">Password</label>
      <div class="field">
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="pw-hint msg">
        <button class="show" type="button" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      <p class="hint" id="pw-hint" style="margin:-10px 0 16px;font-size:12px">At least 8 characters.</p>
    </div>
    <button class="submit" type="submit" id="go"></button>
    <div id="msg" class="msg" role="alert"></div>
  </form>
  <div class="links"><a href="/login">← Sign in</a><a id="other" href="/signup">Create an account</a></div>
</main>
<script>
  const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
  const mode = location.pathname.replace('/', '');  // signup | forgot | reset
  const text = {
    signup: ['Create your account', 'Your own private space for your spending. Only you see it.', 'Create account'],
    forgot: ['Forgot your password?', 'Enter your email. If it has an account, we send a link to choose a new password. It works for 30 minutes.', 'Send reset link'],
    reset: ['Choose a new password', 'You will be signed out on your other devices.', 'Save and sign in'],
  }[mode];
  const errors = {
    taken: 'That email already has an account. Sign in, or use “Forgot password?”.',
    short: 'The password needs at least 8 characters.',
    email: 'Enter a valid email.',
    locked: 'Too many attempts from this network. Try again in 15 minutes.',
    setup: 'Accounts are not set up yet: the site owner needs to add EXPENSE_TOKEN in Vercel.',
    expired: 'This link has expired or was already used. Ask for a new one.',
  };
  document.title = `${text[0]} · Expenses`;
  [$('title').textContent, $('lead').textContent, $('go').textContent] = text;
  $('form').action = location.pathname;
  $('email-row').hidden = mode === 'reset';
  $('pw-row').hidden = mode === 'forgot';
  $('email').required = mode !== 'reset';
  $('password').required = mode !== 'forgot';
  if (mode === 'reset') $('pw-label').textContent = 'New password';
  if (mode === 'signup') { $('other').href = '/forgot'; $('other').textContent = 'Forgot password?'; }
  if (mode === 'forgot') $('password').disabled = true;
  $('t').value = q.get('t') || '';
  $('t').disabled = mode !== 'reset';
  if (mode === 'reset' && !q.get('t') && !q.get('error')) q.set('error', 'expired');
  if (q.get('sent')) {
    $('msg').className = 'msg ok';
    $('msg').textContent = 'If that email has an account, a reset link is on its way. Check your inbox (and spam). No email? Ask the site owner for your link.';
    $('go').hidden = true; $('email-row').hidden = true;
  } else if (q.get('error')) {
    $('msg').textContent = errors[q.get('error')] || 'Something went wrong. Try again.';
    if (q.get('error') === 'expired') { $('pw-row').hidden = true; $('go').hidden = true; $('other').href = '/forgot'; $('other').textContent = 'Get a new link'; }
  }
  const input = $('password'), toggle = document.querySelector('.show');
  toggle.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-pressed', show);
  });
  (mode === 'reset' ? input : $('email')).focus();
</script>
</body>
</html>
